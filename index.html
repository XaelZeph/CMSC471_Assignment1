<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Outcomes by Percentile</title>

    <!-- D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        #chart {
            width: 100%;
            overflow-x: auto;
        }

        svg {
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

    <h1>College Outcomes by Percentile</h1>

    <div class="controls">
        <div class = "dropDowns">
            Outcomes: <select id="xVariable" class="variable"></select>
        </div>

        <div class="checkBoxes">      
            <p>Race:</p>
            <input type="checkbox" id="pooled" class="race" value="pooled", checked="checked"> Pooled
            <input type="checkbox" id="white" class="race" value="white"> White
            <input type="checkbox" id="black" class="race" value="black"> Black
            <input type="checkbox" id="hispanic" class="race" value="hispanic"> Hispanic
            <input type="checkbox" id="asian" class="race" value="asian"> Asian
            <input type="checkbox" id="natam" class="race" value="natam"> Native American
        </div>
        
    </div>


    <div id="chart"></div>

    <script src="js/script.js"></script>

</body>
</html>
